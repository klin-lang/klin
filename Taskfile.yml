# go-task — shared commands on Windows / Linux / macOS
# https://taskfile.dev
#
# Install: https://taskfile.dev/installation/
# List:      task --list

version: "3"

vars:
  # On Windows the binary has a .exe suffix; empty on Unix.
  EXE: '{{if eq OS "windows"}}.exe{{end}}'
  KLIN_BIN: build/klin{{.EXE}}

tasks:
  default:
    desc: list commands
    cmds:
      - task --list

  get:
    desc: fetch Dart dependencies
    run: once
    cmds:
      - dart pub get

  analyze:
    desc: static analysis
    deps: [get]
    cmds:
      - dart analyze

  test:
    desc: all tests (unit + e2e); suites run in parallel by default
    deps: [get]
    cmds:
      - dart test

  test:unit:
    desc: frontend-only tests (no gcc / klin CLI)
    deps: [get]
    cmds:
      - dart test --tags unit

  test:e2e:
    desc: emit→gcc→run, klin CLI, package get
    deps: [get]
    cmds:
      - dart test --tags e2e

  check:
    desc: analyze + test
    deps:
      - analyze
      - test

  hello:
    desc: full hello.kl → C → run
    deps: [get]
    cmds:
      - dart run bin/klin.dart hello.kl

  run:
    desc: "compile and run a .kl file (task run -- path.kl)"
    deps: [get]
    cmds:
      - dart run bin/klin.dart {{.CLI_ARGS}}
    requires:
      vars: [CLI_ARGS]

  release:
    desc: standalone compiler binary (build/klin[.exe])
    deps: [get]
    cmds:
      - dart compile exe bin/klin.dart -o {{.KLIN_BIN}}
    generates:
      - "{{.KLIN_BIN}}"

  clean:
    desc: remove out/ and the release binary
    cmds:
      - cmd: rm -rf out "{{.KLIN_BIN}}"
        platforms: [linux, darwin]
      - cmd: cmd /c "if exist out rmdir /s /q out & if exist {{.KLIN_BIN}} del /f /q {{.KLIN_BIN}}"
        platforms: [windows]
