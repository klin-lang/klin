# Build Klin release binaries and publish a GitHub Release (issue 067, 076).
# Trigger: push tag v* (e.g. v0.1.0). Repo should be public for Homebrew users.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset: klin-macos-arm64
            ext: tar.gz
            bin: klin
          # macos-13 retired; last GitHub-hosted Intel macOS label (EOL ~2027).
          - os: macos-15-intel
            asset: klin-macos-amd64
            ext: tar.gz
            bin: klin
          - os: ubuntu-22.04
            asset: klin-linux-amd64
            ext: tar.gz
            bin: klin
          - os: ubuntu-24.04-arm
            asset: klin-linux-arm64
            ext: tar.gz
            bin: klin
          - os: windows-latest
            asset: klin-windows-amd64
            ext: zip
            bin: klin.exe
          # Windows ARM64 runner is newer; do not fail the whole release if it breaks.
          - os: windows-11-arm
            asset: klin-windows-arm64
            ext: zip
            bin: klin.exe
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # Unix (macOS / Linux): tar.gz + shasum.
      - name: Build (unix)
        if: runner.os != 'Windows'
        run: |
          dart pub get
          dart compile exe bin/klin.dart -o "${{ matrix.bin }}"
          mkdir -p dist/stdlib dist/templates
          cp -R stdlib/. dist/stdlib/
          cp -R templates/. dist/templates/
          cp "${{ matrix.bin }}" dist/
          tar -C dist -czf "${{ matrix.asset }}.${{ matrix.ext }}" "${{ matrix.bin }}" stdlib templates
          shasum -a 256 "${{ matrix.asset }}.${{ matrix.ext }}" | tee "${{ matrix.asset }}.sha256"

      # Windows: zip + Get-FileHash.
      - name: Build (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dart pub get
          dart compile exe bin/klin.dart -o "${{ matrix.bin }}"
          New-Item -ItemType Directory -Force -Path dist/stdlib, dist/templates | Out-Null
          Copy-Item -Recurse -Force stdlib/* dist/stdlib/
          Copy-Item -Recurse -Force templates/* dist/templates/
          Copy-Item -Force "${{ matrix.bin }}" dist/
          # Compress from inside dist so the archive root has the binary and
          # stdlib/ + templates/ side by side (matching Unix `tar -C dist`).
          Push-Location dist
          Compress-Archive -Path "${{ matrix.bin }}", stdlib, templates -DestinationPath "..\${{ matrix.asset }}.${{ matrix.ext }}" -Force
          Pop-Location
          $h = (Get-FileHash "${{ matrix.asset }}.${{ matrix.ext }}" -Algorithm SHA256).Hash.ToLower()
          # Write LF (no CRLF/BOM) so the sidecar matches Unix shasum -c format.
          [System.IO.File]::WriteAllText("${{ matrix.asset }}.sha256", "$h  ${{ matrix.asset }}.${{ matrix.ext }}`n")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.${{ matrix.ext }}
            ${{ matrix.asset }}.sha256

  source-checksum:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Checksum GitHub-style source archive note
        run: |
          # Homebrew stable url uses GitHub's tag archive. After the release
          # exists, compute: curl -sL "$URL" | shasum -a 256
          ver="${GITHUB_REF_NAME#v}"
          echo "After publish, fill Formula/klin.rb sha256 from:"
          echo "  https://github.com/klin-lang/klin/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          echo "version: ${ver}"

  publish:
    needs: [build, source-checksum]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
